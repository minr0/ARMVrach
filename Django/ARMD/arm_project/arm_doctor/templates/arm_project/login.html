<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — АРМ Сельского Врача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a6b3a 0%, #0d4a28 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            padding: 2.5rem; width: 100%; max-width: 420px;
        }
        .logo-circle {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #1a6b3a, #28a745);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }
        .btn-login { background: linear-gradient(135deg, #1a6b3a, #28a745); border: none; }
        .btn-login:hover { opacity: .9; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo-circle">
        <i class="bi bi-heart-pulse-fill text-white" style="font-size:2rem;"></i>
    </div>
    <h4 class="text-center fw-bold mb-1">АРМ Сельского Врача</h4>
    <p class="text-center text-muted small mb-4">Вход для медицинского персонала</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-danger py-2">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Имя пользователя</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="doctor_ivanov" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Пароль</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-login btn-success w-100 py-2 text-white fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
        </button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">Только для авторизованного медицинского персонала</p>
</div>
</body>
</html>
